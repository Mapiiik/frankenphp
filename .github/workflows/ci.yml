name: CI

on:
  workflow_dispatch:
  # An hour before the images built on this one look for a new base
  schedule:
    - cron: '0 2 * * *'
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  # The PHP versions an image is built for, newest first
  PHP_VERSIONS: '8.4 8.3'
  XCADDY_IMAGE: caddy:2-builder-alpine

jobs:
  ##########################################################################
  # Resolve what to build, once, and share it with the build jobs: for each
  # PHP version a key from the FrankenPHP version and the base image digests,
  # and on the nightly run only the versions whose key has no image yet
  ##########################################################################
  setup:
    name: Resolve FrankenPHP versions and base images
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      builds: ${{ steps.resolve.outputs.builds }}
      merges: ${{ steps.resolve.outputs.merges }}

    steps:
      # docker/metadata-action lowercases the image name on its own, but the
      # digest push and the manifest merge below address the registry directly,
      # so the lowercase name has to be built here explicitly.
      - name: Normalize image name
        id: image
        run: |
          REPO="${{ github.repository }}"
          echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve versions and build keys
        id: resolve
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          EVENT: ${{ github.event_name }}
        run: |
          builds='[]'
          merges='[]'
          for php in $PHP_VERSIONS; do
            base="dunglas/frankenphp:php${php}-alpine"
            builder="dunglas/frankenphp:builder-php${php}-alpine"
            frankenphp="$(docker run --rm "$base" frankenphp version | sed -E 's/^FrankenPHP v([^ ]+).*/\1/')"
            digest="$(for i in "$base" "$builder" "$XCADDY_IMAGE"; do docker buildx imagetools inspect --raw "$i"; done | sha256sum | cut -c1-12)"
            key="build-${frankenphp}-php${php}-${digest}"
            echo "::notice::PHP $php: FrankenPHP $frankenphp, base images digest $digest"
            if [ "$EVENT" = "schedule" ] && docker manifest inspect "$IMAGE:$key" >/dev/null 2>&1; then
              echo "::notice::PHP $php: $key already exists, skipping."
              continue
            fi
            merges="$(jq -c --arg php "$php" --arg frankenphp "$frankenphp" --arg key "$key" \
              '. + [{php: $php, frankenphp: $frankenphp, key: $key}]' <<< "$merges")"
            for target in amd64:ubuntu-latest arm64:ubuntu-24.04-arm; do
              builds="$(jq -c --arg php "$php" --arg arch "${target%%:*}" --arg runner "${target#*:}" \
                '. + [{php: $php, arch: $arch, runner: $runner, platform: ("linux/" + $arch)}]' <<< "$builds")"
            done
          done
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "merges=$merges" >> "$GITHUB_OUTPUT"

  ##########################################################################
  # One job per PHP version and architecture, each on a native runner (no
  # QEMU emulation). Nothing is tagged here - each job pushes an untagged
  # image and reports back only its digest.
  ##########################################################################
  build:
    name: Build PHP ${{ matrix.php }} ${{ matrix.platform }}
    needs: setup
    if: needs.setup.outputs.builds != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.builds) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.setup.outputs.image }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The configuration is checked in every mode before anything is pushed
      - name: Build for the test
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          context: .
          load: true
          tags: frankenphp-test
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          cache-from: type=gha,scope=php${{ matrix.php }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}-${{ matrix.platform }}

      - name: Validate the configuration
        run: |
          docker run --rm frankenphp-test sh -c 'frankenphp list-modules' | grep -qx 'http.handlers.rate_limit'
          docker run --rm -v "$PWD/tests:/tests:ro" frankenphp-test sh /tests/validate.sh

      # Pull requests cannot push, so they build into the cache only and
      # produce no digest for the merge job.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: ${{ needs.setup.outputs.image }}
          outputs: ${{ github.event_name != 'pull_request' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          cache-from: type=gha,scope=php${{ matrix.php }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}-${{ matrix.platform }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-php${{ matrix.php }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  ##########################################################################
  # For each PHP version, join the per-architecture digests into one
  # multi-arch manifest and attach the real tags to it.
  ##########################################################################
  merge:
    name: Push multi-arch manifest PHP ${{ matrix.php }}
    needs:
      - setup
      - build
    if: needs.setup.outputs.merges != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.merges) }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-php${{ matrix.php }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # php8.4 follows FrankenPHP, 1.13-php8.4 and 1.13.2-php8.4 stay on its minor and patch release
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.setup.outputs.image }}
          PHP: ${{ matrix.php }}
          FRANKENPHP: ${{ matrix.frankenphp }}
          KEY: ${{ matrix.key }}
        run: |
          minor="${FRANKENPHP%.*}"
          docker buildx imagetools create \
            -t "$IMAGE:php$PHP" \
            -t "$IMAGE:$minor-php$PHP" \
            -t "$IMAGE:$FRANKENPHP-php$PHP" \
            -t "$IMAGE:sha-${GITHUB_SHA::7}-php$PHP" \
            -t "$IMAGE:$KEY" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ needs.setup.outputs.image }}:${{ matrix.key }}"
